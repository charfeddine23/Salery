name: Android Release Build & Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "my-upload-key.jks" ]; then
            echo "Using repository permanent release keystore for upgrade consistency..."
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Creating consistent release keystore..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=SaleryPulse, OU=Finance, O=SaleryPulse, L=Algiers, C=DZ"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace -Djava.awt.headless=true

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$RELEASE_DIR" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          NEW_APK_NAME="SaleryPulse-v${{ github.run_number }}.apk"
          cp "$APK_FILE" "$NEW_APK_NAME"
          echo "apk_path=$NEW_APK_NAME" >> $GITHUB_OUTPUT
          
          # Compute Release Tag & Title
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Clean Up Previous GitHub Releases and Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Wiping obsolete releases to keep only the latest version active..."
          PREVIOUS_RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName' || true)
          for tag in $PREVIOUS_RELEASES; do
            if [ "$tag" != "${{ steps.prepare_artifacts.outputs.tag_name }}" ]; then
              echo "Deleting obsolete release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || echo "Failed to delete $tag, continuing..."
            fi
          done

      - name: Publish New Release to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.prepare_artifacts.outputs.tag_name }}" \
            "${{ steps.prepare_artifacts.outputs.apk_path }}" \
            --title "SaleryPulse Release ${{ steps.prepare_artifacts.outputs.tag_name }}" \
            --notes "### SaleryPulse Android Release
            - **Developer:** Kahlessenane Charfeddine
            - **Build:** ${{ steps.prepare_artifacts.outputs.tag_name }}
            - **UI:** Liquid Glass v3 (Light & Dark Mode)
            - **Currency:** Algerian Dinar (DZD)
            - **Features:** Smart Salary Scheduler, Debt Auto-Payments, Pattern Gesture Lock, Local & Drive Backup.
            - Automatically generated by GitHub Actions CI/CD."
